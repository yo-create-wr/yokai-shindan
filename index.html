<html lang="ja">
<head>

  <meta name="description" content="YO CREATEのWebコンテンツ入口。エブリデイ クイックタロットと妖怪診断を無料・登録不要で利用できます。">

  <style>
    :root{--bg:#090b10;--panel:#10131a;--line:rgba(255,255,255,.105);--text:#f5f4f1;--muted:#a4a7b0;--r:26px}
    *{box-sizing:border-box}
    html{background:var(--bg)}
    body{margin:0;min-height:100vh;color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Yu Gothic",Meiryo,sans-serif;background:radial-gradient(circle at 50% -10%,rgba(98,88,145,.13),transparent 38%),#090b10;-webkit-font-smoothing:antialiased}
    a{color:inherit;text-decoration:none;-webkit-tap-highlight-color:transparent}
    .page{width:min(1160px,calc(100% - 40px));margin:auto;padding:0 0 34px}
    header{height:122px;display:flex;align-items:center;justify-content:center;border-bottom:1px solid rgba(255,255,255,.055);position:relative}
    .brand{font-family:Georgia,"Times New Roman",serif;font-size:clamp(29px,4vw,42px);letter-spacing:.12em;font-weight:500;white-space:nowrap}
    .lang-toggle{position:absolute;right:0;top:50%;transform:translateY(-50%);min-width:58px;height:36px;padding:0 14px;border:1px solid rgba(255,255,255,.16);border-radius:999px;background:rgba(255,255,255,.045);color:var(--text);font:600 11px/1 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;letter-spacing:.08em;cursor:pointer;transition:.25s}
    .lang-toggle:hover{background:rgba(255,255,255,.1);border-color:rgba(255,255,255,.28)}
    main{padding:48px 0 42px}
    .services{display:grid;grid-template-columns:1fr 1fr;gap:22px}
    .card{display:flex;flex-direction:column;min-width:0;overflow:hidden;border:1px solid var(--line);border-radius:var(--r);background:linear-gradient(180deg,rgba(255,255,255,.055),rgba(255,255,255,.025));transition:transform .42s cubic-bezier(.2,.8,.2,1),border-color .35s,box-shadow .35s;box-shadow:0 20px 70px rgba(0,0,0,.2)}
    .card:hover{transform:translateY(-6px);border-color:rgba(255,255,255,.22);box-shadow:0 30px 90px rgba(0,0,0,.35)}
    .visual{height:330px;display:grid;place-items:center;overflow:hidden;background:#090b10;position:relative}
    .visual:after{content:"";position:absolute;inset:0;box-shadow:inset 0 -35px 45px rgba(9,11,16,.34);pointer-events:none}
    .visual img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .7s cubic-bezier(.2,.8,.2,1)}
    .tarot .visual img{object-fit:contain;padding:14px 20px 0}
    .yokai .visual img{object-fit:contain;object-position:center;padding:26px 34px;transform:none}
    .yokai:hover .visual img{transform:scale(1.01)}
    .card:hover .visual img{transform:scale(1.025)}
    .body{padding:25px 28px 27px;display:grid;grid-template-columns:1fr auto;gap:8px 18px;align-items:center}
    h1{font-size:clamp(24px,3vw,31px);letter-spacing:-.035em;margin:0;font-weight:650}
    p{grid-column:1;margin:0;color:var(--muted);font-size:13px;line-height:1.7}
    .go{grid-column:2;grid-row:1 / span 2;width:46px;height:46px;border:1px solid rgba(255,255,255,.14);border-radius:50%;display:grid;place-items:center;font-size:20px;transition:.35s}
    .card:hover .go{background:#f4f2ec;color:#0b0d12;border-color:#f4f2ec;transform:translateX(3px)}
    footer{min-height:68px;border-top:1px solid rgba(255,255,255,.07);display:flex;justify-content:space-between;align-items:center;gap:20px;color:#767b87;font-size:11px}
    footer a{transition:.25s} footer a:hover{color:#fff}.links{display:flex;gap:22px}

    .reading{margin-top:30px;border-top:1px solid rgba(255,255,255,.07);padding-top:28px}.reading-head{display:flex;align-items:end;justify-content:space-between;gap:16px;margin-bottom:12px}.reading-head h2{margin:0;font-size:14px;letter-spacing:.02em}.reading-head span{font-size:10px;color:#6f7480;letter-spacing:.1em}.reading-links{display:grid;grid-template-columns:1fr 1fr;gap:10px}.reading-link{border:1px solid var(--line);border-radius:18px;padding:17px 18px;display:flex;align-items:center;justify-content:space-between;gap:14px;background:rgba(255,255,255,.02);transition:.3s}.reading-link:hover{transform:translateY(-3px);background:rgba(255,255,255,.045);border-color:rgba(255,255,255,.2)}.reading-link strong{font-size:14px}.reading-link small{display:block;margin-top:5px;color:#777d88;font-size:10px}.reading-link i{font-style:normal;color:#8e94a0}
    @media(max-width:760px){
      .page{width:min(100% - 24px,620px)}
      header{height:92px}.brand{font-size:29px}.lang-toggle{right:2px;min-width:54px;height:34px;padding:0 11px}
      main{padding:26px 0 34px}.services{grid-template-columns:1fr;gap:16px}.reading-links{grid-template-columns:1fr}
      .visual{height:265px}.tarot .visual img{padding:9px 12px 0}.yokai .visual img{padding:20px 18px}.body{padding:21px 21px 23px}
      footer{padding:20px 2px;align-items:flex-start;flex-direction:column}.links{gap:16px;flex-wrap:wrap}
    }
    @media(max-width:420px){.visual{height:235px}h1{font-size:23px}.body{grid-template-columns:1fr auto}.go{width:42px;height:42px}}
    @media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important}.card,.visual img,.go{transition:none!important}}
  </style>
</head>
<body>
  <div class="page">
    <header><a class="brand" href="/">YO CREATE</a><button id="languageToggle" class="lang-toggle" type="button" aria-label="Switch to English">EN</button></header>

    <main>
      <div class="services">
        <a id="tarotCard" class="card tarot" href="/quick-tarot/" aria-label="エブリデイ クイックタロットを開く" onclick="trackPortal('quick_tarot')">
          <div class="visual"><img id="tarotImage" src="assets/tarot-portal.webp" alt="カード裏面2枚と太陽のタロットカード"></div>
          <div class="body">
            <h1 id="tarotTitle">クイックタロット</h1>
            <p id="tarotDesc">3枚のカードからアドバイスを受け取る</p>
            <span class="go" aria-hidden="true">→</span>
          </div>
        </a>

        <a id="yokaiCard" class="card yokai" href="/yokai-shindan/" aria-label="妖怪診断を開く" onclick="trackPortal('yokai_shindan')">
          <div class="visual"><img id="yokaiImage" src="assets/yokai-portal.webp" alt="河童、唐傘小僧、ろくろ首、のっぺらぼう"></div>
          <div class="body">
            <h1 id="yokaiTitle">妖怪診断</h1>
            <p id="yokaiDesc">12の質問からあなたの妖怪タイプを診断</p>
            <span class="go" aria-hidden="true">→</span>
          </div>
        </a>
      </div>
      <section class="reading" aria-labelledby="readingTitle"><div class="reading-head"><h2 id="readingTitle">読みもの</h2><span id="readingNote">GUIDES</span></div><div class="reading-links"><a id="tarotGuide" class="reading-link" href="/guides/tarot/" onclick="trackGuide('tarot')"><div><strong id="tarotGuideTitle">大アルカナ22枚を知る</strong><small id="tarotGuideDesc">カードの意味と行動のヒント</small></div><i>→</i></a><a id="yokaiGuide" class="reading-link" href="/guides/yokai/" onclick="trackGuide('yokai')"><div><strong id="yokaiGuideTitle">妖怪12体を知る</strong><small id="yokaiGuideDesc">伝承と診断タイプの違い</small></div><i>→</i></a></div></section>
    </main>

    <footer>
      <span>© YO CREATE</span>
      <div class="links"><a href="/about/">ABOUT</a><a href="/privacy/">PRIVACY</a><a href="/disclaimer/">DISCLAIMER</a><a href="https://x.com/douyoh" target="_blank" rel="noopener noreferrer">CONTACT</a></div>
    </footer>
  </div>
  <script>
    const LANGUAGE_KEY = "yoCreateLanguage";
    let currentLanguage = (() => {
      try { return localStorage.getItem(LANGUAGE_KEY) === "en" ? "en" : "ja"; }
      catch (error) { return "ja"; }
    })();

    const portalCopy = {
      ja: {
        title: "YO CREATE｜クイックタロット・妖怪診断",
        description: "YO CREATEのWebコンテンツ入口。エブリデイ クイックタロットと妖怪診断を無料・登録不要で利用できます。",
        ogDescription: "クイックタロットと妖怪診断。",
        tarotTitle: "クイックタロット",
        tarotDesc: "3枚のカードからアドバイスを受け取る",
        yokaiTitle: "妖怪診断",
        yokaiDesc: "12の質問からあなたの妖怪タイプを診断",
        tarotAria: "エブリデイ クイックタロットを開く",
        yokaiAria: "妖怪診断を開く",
        tarotAlt: "カード裏面2枚と太陽のタロットカード",
        yokaiAlt: "河童、唐傘小僧、ろくろ首、のっぺらぼう",
        button: "EN",
        buttonAria: "Switch to English",
        readingTitle: "読みもの", readingNote: "GUIDES", tarotGuideTitle: "大アルカナ22枚を知る", tarotGuideDesc: "カードの意味と行動のヒント", yokaiGuideTitle: "妖怪12体を知る", yokaiGuideDesc: "伝承と診断タイプの違い"
      },
      en: {
        title: "YO CREATE | Quick Tarot & Yokai Diagnosis",
        description: "YO CREATE web experiences: Quick Tarot and Yokai Diagnosis. Free to use with no registration required.",
        ogDescription: "Quick Tarot and Yokai Diagnosis.",
        tarotTitle: "Quick Tarot",
        tarotDesc: "Receive guidance from three cards",
        yokaiTitle: "Yokai Diagnosis",
        yokaiDesc: "Discover your yokai personality type in 12 questions",
        tarotAria: "Open Everyday Quick Tarot",
        yokaiAria: "Open Yokai Diagnosis",
        tarotAlt: "Two tarot card backs with The Sun card",
        yokaiAlt: "Kappa, Karakasa-kozo, Rokurokubi, and Noppera-bo",
        button: "日本語",
        buttonAria: "日本語に切り替える",
        readingTitle: "Guides", readingNote: "JAPANESE ARTICLES", tarotGuideTitle: "Major Arcana Guide", tarotGuideDesc: "22 card meanings and practical reflections", yokaiGuideTitle: "Yokai Guide", yokaiGuideDesc: "12 yokai stories and diagnosis types"
      }
    };

    function applyPortalLanguage(){
      const copy = portalCopy[currentLanguage];
      document.documentElement.lang = currentLanguage;
      document.title = copy.title;
      const desc = document.querySelector('meta[name="description"]');
      if (desc) desc.content = copy.description;
      const ogDesc = document.querySelector('meta[property="og:description"]');
      if (ogDesc) ogDesc.content = copy.ogDescription;
      document.getElementById("tarotTitle").textContent = copy.tarotTitle;
      document.getElementById("tarotDesc").textContent = copy.tarotDesc;
      document.getElementById("yokaiTitle").textContent = copy.yokaiTitle;
      document.getElementById("yokaiDesc").textContent = copy.yokaiDesc;
      document.getElementById("tarotCard").setAttribute("aria-label", copy.tarotAria);
      document.getElementById("yokaiCard").setAttribute("aria-label", copy.yokaiAria);
      document.getElementById("tarotImage").alt = copy.tarotAlt;
      document.getElementById("yokaiImage").alt = copy.yokaiAlt;
      document.getElementById("readingTitle").textContent = copy.readingTitle;
      document.getElementById("readingNote").textContent = copy.readingNote;
      document.getElementById("tarotGuideTitle").textContent = copy.tarotGuideTitle;
      document.getElementById("tarotGuideDesc").textContent = copy.tarotGuideDesc;
      document.getElementById("yokaiGuideTitle").textContent = copy.yokaiGuideTitle;
      document.getElementById("yokaiGuideDesc").textContent = copy.yokaiGuideDesc;
      const toggle = document.getElementById("languageToggle");
      toggle.textContent = copy.button;
      toggle.setAttribute("aria-label", copy.buttonAria);
    }

    document.getElementById("languageToggle").addEventListener("click", () => {
      currentLanguage = currentLanguage === "ja" ? "en" : "ja";
      try { localStorage.setItem(LANGUAGE_KEY, currentLanguage); } catch (error) {}
      applyPortalLanguage();
    });

    function trackPortal(service){ if(typeof gtag === 'function') gtag('event','portal_select',{service_name:service}); }
    function trackGuide(topic){ if(typeof gtag === 'function') gtag('event','guide_select',{guide_topic:topic}); }

    applyPortalLanguage();
  </script>
</body>
</html>
